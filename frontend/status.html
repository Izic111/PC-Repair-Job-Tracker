<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Check Repair Status</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
  :root { --navy: #1F3864; --bg: #f5f6f8; --card: #ffffff; --border: #e2e4e9; --text: #23262b; --muted: #6b7280; --received: #f59e0b; --progress: #3b82f6; --done: #22c55e; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px 16px 60px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { color: var(--navy); font-size: 1.4rem; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit; }
  button { width: 100%; background: var(--navy); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 0.95rem; cursor: pointer; }
  .error { color: #dc2626; font-size: 0.85rem; margin-top: 10px; text-align: center; }
  .loading { color: var(--muted); text-align: center; padding: 20px 0; }
  .status-badge { display: inline-block; padding: 6px 16px; border-radius: 999px; font-size: 0.9rem; font-weight: 600; color: white; margin-bottom: 16px; }
  .status-badge.Received { background: var(--received); }
  .status-badge.In-Progress { background: var(--progress); }
  .status-badge.Done { background: var(--done); }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--muted); }
  .progress-steps { display: flex; justify-content: space-between; margin: 20px 0 24px; position: relative; }
  .step { flex: 1; text-align: center; font-size: 0.78rem; color: var(--muted); }
  .step-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--border); margin: 0 auto 6px; }
  .step.active .step-dot { background: var(--navy); }
  .step.active { color: var(--navy); font-weight: 600; }
</style>
</head>
<body>
<div id="app" class="wrap">
  <h1>Check Repair Status</h1>

  <div class="card">
    <div class="field" v-if="!job">
      <label>Tracking ID</label>
      <input v-model="trackingIdInput" placeholder="Paste your tracking ID" @keyup.enter="lookup" />
      <button style="margin-top: 10px;" @click="lookup" :disabled="loading">
        {{ loading ? 'Checking...' : 'Check Status' }}
      </button>
      <div class="error" v-if="error">{{ error }}</div>
    </div>

    <div v-else>
      <div class="progress-steps">
        <div class="step" :class="{ active: stepIndex >= 0 }">
          <div class="step-dot"></div>Received
        </div>
        <div class="step" :class="{ active: stepIndex >= 1 }">
          <div class="step-dot"></div>In Progress
        </div>
        <div class="step" :class="{ active: stepIndex >= 2 }">
          <div class="step-dot"></div>Done
        </div>
      </div>

      <span class="status-badge" :class="job.status.replace(' ', '-')">{{ job.status }}</span>

      <div class="detail-row"><span class="detail-label">Client</span><span>{{ job.client_name }}</span></div>
      <div class="detail-row"><span class="detail-label">Device</span><span>{{ job.device }}</span></div>
      <div class="detail-row"><span class="detail-label">Issue</span><span>{{ job.issue }}</span></div>
      <div class="detail-row"><span class="detail-label">Submitted</span><span>{{ job.created_at }}</span></div>

      <button style="margin-top: 16px;" @click="job = null; trackingIdInput = ''">Check another</button>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;

const API_BASE = "https://pc-repair-job-tracker.onrender.com";

createApp({
  data() {
    return {
      trackingIdInput: "",
      job: null,
      loading: false,
      error: "",
    };
  },
  computed: {
    stepIndex() {
      if (!this.job) return -1;
      return { "Received": 0, "In Progress": 1, "Done": 2 }[this.job.status] ?? 0;
    },
  },
  mounted() {
    // Auto-fill from ?id=... in the URL, e.g. status.html?id=abc123
    const params = new URLSearchParams(window.location.search);
    const idFromUrl = params.get("id");
    if (idFromUrl) {
      this.trackingIdInput = idFromUrl;
      this.lookup();
    }
  },
  methods: {
    async lookup() {
      this.error = "";
      if (!this.trackingIdInput.trim()) {
        this.error = "Please enter a tracking ID.";
        return;
      }
      this.loading = true;
      try {
        const res = await fetch(`${API_BASE}/public/jobs/${encodeURIComponent(this.trackingIdInput.trim())}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Job not found.");
        this.job = data;
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    },
  },
}).mount("#app");
</script>
</body>
</html>
