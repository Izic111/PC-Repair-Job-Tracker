<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PC Repair Job Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
  :root {
    --navy: #1F3864;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #23262b;
    --muted: #6b7280;
    --received: #f59e0b;
    --progress: #3b82f6;
    --done: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { color: var(--navy); font-size: 1.5rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-top: 0; margin-bottom: 20px; font-size: 0.9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 12px; color: var(--navy); }
  .field { margin-bottom: 12px; }
  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  input, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    background: var(--navy);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  button.danger {
    background: transparent;
    color: #dc2626;
    border: 1px solid #dc2626;
    padding: 6px 10px;
    font-size: 0.8rem;
  }
  .error { color: #dc2626; font-size: 0.85rem; margin-top: 8px; }
  .job {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    background: var(--card);
  }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .job-name { font-weight: 600; }
  .job-meta { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .job-issue { margin-top: 8px; font-size: 0.9rem; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    color: white;
    white-space: nowrap;
  }
  .badge.Received { background: var(--received); }
  .badge.In-Progress { background: var(--progress); }
  .badge.Done { background: var(--done); }
  .job-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 0.9rem; }
  .loading { color: var(--muted); text-align: center; padding: 20px 0; font-size: 0.9rem; }
</style>
</head>
<body>
<div id="app" class="wrap">
  <h1>PC Repair Job Tracker</h1>
  <p class="sub">Track client repairs from intake to completion.</p>

  <div class="card">
    <h2>New Job</h2>
    <div class="field">
      <label>Client Name *</label>
      <input v-model="form.client_name" placeholder="e.g. John Doe" />
    </div>
    <div class="field">
      <label>Phone</label>
      <input v-model="form.phone" placeholder="e.g. 08012345678" />
    </div>
    <div class="field">
      <label>Device *</label>
      <input v-model="form.device" placeholder="e.g. HP Pavilion 15" />
    </div>
    <div class="field">
      <label>Issue *</label>
      <textarea v-model="form.issue" placeholder="Describe the problem"></textarea>
    </div>
    <button @click="createJob" :disabled="submitting">
      {{ submitting ? 'Adding...' : 'Add Job' }}
    </button>
    <div class="error" v-if="error">{{ error }}</div>
  </div>

  <div class="card">
    <h2>Jobs ({{ jobs.length }})</h2>
    <div class="loading" v-if="loading">Loading jobs...</div>
    <div class="empty" v-else-if="jobs.length === 0">No jobs yet — add one above.</div>
    <div v-else>
      <div class="job" v-for="job in jobs" :key="job.id">
        <div class="job-top">
          <div>
            <div class="job-name">{{ job.client_name }}</div>
            <div class="job-meta">{{ job.device }} &middot; {{ job.phone || 'no phone' }} &middot; {{ job.created_at }}</div>
          </div>
          <span class="badge" :class="job.status.replace(' ', '-')">{{ job.status }}</span>
        </div>
        <div class="job-issue">{{ job.issue }}</div>
        <div class="job-actions">
          <select :value="job.status" @change="updateStatus(job, $event.target.value)">
            <option>Received</option>
            <option>In Progress</option>
            <option>Done</option>
          </select>
          <button class="danger" @click="deleteJob(job.id)">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;

// Change this to your deployed backend URL once live
// e.g. "https://your-app-name.onrender.com"
const API_BASE = "https://pc-repair-job-tracker.onrender.com";

createApp({
  data() {
    return {
      jobs: [],
      loading: true,
      submitting: false,
      error: "",
      form: { client_name: "", phone: "", device: "", issue: "" },
    };
  },
  mounted() {
    this.fetchJobs();
  },
  methods: {
    async fetchJobs() {
      this.loading = true;
      try {
        const res = await fetch(`${API_BASE}/jobs`);
        this.jobs = await res.json();
      } catch (e) {
        this.error = "Could not load jobs. Is the backend running?";
      } finally {
        this.loading = false;
      }
    },
    async createJob() {
      this.error = "";
      if (!this.form.client_name || !this.form.device || !this.form.issue) {
        this.error = "Client name, device, and issue are required.";
        return;
      }
      this.submitting = true;
      try {
        const res = await fetch(`${API_BASE}/jobs`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(this.form),
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.error || "Failed to add job");
        }
        this.form = { client_name: "", phone: "", device: "", issue: "" };
        await this.fetchJobs();
      } catch (e) {
        this.error = e.message;
      } finally {
        this.submitting = false;
      }
    },
    async updateStatus(job, newStatus) {
      try {
        await fetch(`${API_BASE}/jobs/${job.id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        await this.fetchJobs();
      } catch (e) {
        this.error = "Could not update job status.";
      }
    },
    async deleteJob(id) {
      if (!confirm("Delete this job?")) return;
      try {
        await fetch(`${API_BASE}/jobs/${id}`, { method: "DELETE" });
        await this.fetchJobs();
      } catch (e) {
        this.error = "Could not delete job.";
      }
    },
  },
}).mount("#app");
</script>
</body>
</html>
